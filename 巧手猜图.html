<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>巧手猜图 · 网页版</title>
<style>
:root{
  --bg:#F6F3EC; --ink:#26303A; --muted:#6B7280; --line:#E3DDD0;
  --card:#FFFFFF; --brand:#3B5BDB; --brand-d:#2C4BB8; --accent:#F59F00;
  --ok:#2F9E44; --bad:#E03131; --gold:#E8A822; --stage:#FBFAF6;
  --radius:16px; --shadow:0 6px 24px rgba(38,48,58,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:10px;background:#EFEBE0;color:var(--ink);padding:9px 14px;transition:.12s}
button:hover{background:#E6E1D3}
button.primary{background:var(--brand);color:#fff;font-weight:600}
button.primary:hover{background:var(--brand-d)}
button.accent{background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;border:1.5px solid var(--line)}
button.ghost.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1080px;margin:0 auto;padding:18px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 6px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;color:var(--brand-d);background:#E7EDFF;border-radius:999px;padding:2px 10px;margin-right:6px}
a{color:var(--brand-d)}
/* 首页 */
.hero{text-align:center;padding:30px 20px 8px}
.hero .ruleset{margin-top:8px;font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.rule-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.rule-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;text-align:left}
.rule-card h3{margin:0 0 4px;color:var(--ink)}
.rule-card .big{font-size:24px}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.hero-actions .alt{background:#F59F00;border-color:#E8890C}
.mask{position:fixed;inset:0;background:rgba(24,28,41,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.modal{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:84vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal h2{margin:0 0 10px;font-size:17px}
.radio-line{display:block;margin:6px 0;font-size:13px;color:#343A40}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cat-tab{padding:4px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:12px;color:#495057}
.cat-tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.img-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.img-cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border:2px solid var(--line);border-radius:8px;background:#fff}
.img-cell img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:4px}
.img-cell span{font-size:10px;color:#495057}
.img-cell.on{border-color:var(--brand);background:#EDF1FF}
.pm{flex:1;border:1.5px solid var(--line);background:#FCFBF8;border-radius:10px;padding:8px 4px;font-size:13px;color:var(--ink);cursor:pointer}
.pm:not(:disabled):hover{border-color:var(--brand);color:var(--brand)}
.pm-on{border-color:var(--brand);background:var(--brand);color:#fff;font-weight:700}
.pm:disabled{opacity:.45;cursor:not-allowed;background:#F1EEE6}
.mini-del{position:absolute;right:2px;top:2px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:6px;font-size:10px;padding:1px 5px;color:var(--bad);cursor:pointer;z-index:2}
.save-btn,.edit-btn{position:absolute;left:2px;bottom:2px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:6px;font-size:10px;padding:1px 5px;color:var(--ink);cursor:pointer;z-index:2}
#pw-shared .img-cell{position:relative}
.pw-in{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;margin-top:6px;background:#FCFBF8;color:var(--ink)}
.field-label{font-size:12px;color:var(--muted);margin-top:8px}
.kw-line{font-size:14px;margin-top:6px;display:flex;justify-content:space-between;gap:10px;background:#F6F2E8;border-radius:8px;padding:7px 10px}
.img-cell.imported{border-color:#C7BCA4;background:#FAF7F0}
.import-tag{position:absolute;top:2px;right:2px;background:rgba(90,98,120,.75);color:#fff;font-size:10px;border-radius:6px;padding:1px 6px;z-index:2}
.hit-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.hit-badge{font-size:12px;border-radius:999px;padding:3px 10px;background:#EFEBE0;color:var(--muted);border:1px solid var(--line)}
.hit-badge.on{background:#E7F4E8;color:#1E7D32;border-color:#4CAF50;font-weight:600}
.hit-badge b{font-weight:700}
.stage-wrap.time-warn{outline:3px solid #E03131;outline-offset:-2px;border-radius:12px}
.stage-wrap.time-warn .timer-hint{display:block}
.timer-hint{display:none;position:absolute;top:8px;right:50%;transform:translateX(50%);background:rgba(224,49,49,.92);color:#fff;font-weight:700;border-radius:999px;padding:4px 14px;font-size:13px;z-index:5;pointer-events:none}
.pop .pw-in{border-color:#C7BCA4;background:#FFFEFA}
.file-drop{display:block;border:2px dashed #C7BCA4;border-radius:12px;padding:20px 12px;text-align:center;cursor:pointer;margin-top:10px;background:#FFFDF6}
.file-drop:hover{border-color:var(--brand);background:#FAF7F0}
.file-pick{display:inline-block;background:var(--brand);color:#fff;font-weight:600;border-radius:10px;padding:9px 22px;margin-top:2px}
.pop{background:#FFFDFA;border:1px solid #EFE9DC;border-radius:16px;padding:18px;box-shadow:0 12px 40px rgba(24,28,41,.28);max-height:85vh;overflow:auto;box-sizing:border-box}
.pop .row{margin-top:14px}
.pt-tab{padding:6px 14px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.pt-tab.on{background:#FFF8E6;border-color:var(--gold);font-weight:600}
.img-broken{position:absolute;left:4px;right:4px;bottom:26px;background:rgba(193,39,45,.88);color:#fff;font-size:10px;text-align:center;border-radius:5px;padding:1px 2px;pointer-events:none;z-index:3}
.img-cell.is-up{opacity:.55}
.img-done{position:absolute;left:4px;top:4px;background:rgba(34,139,34,.88);color:#fff;font-size:10px;border-radius:5px;padding:1px 5px;pointer-events:none;z-index:3}
.cw-del{position:absolute;right:2px;top:2px;background:rgba(255,255,255,.95);border:1px solid #E3DDD0;border-radius:6px;font-size:11px;padding:1px 6px;color:#C1272D;cursor:pointer;z-index:4;display:none}
.img-cell.on .cw-del{display:block}
.cw-confirm{position:absolute;inset:0;background:rgba(24,28,41,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:5;border-radius:6px}
.cw-confirm span{color:#fff;font-size:11px}
.target-strip{display:flex;align-items:center;gap:10px;background:#FFF8E6;border:2px solid var(--gold);border-radius:12px;padding:10px;margin:10px 0}
.target-strip .tp-photo{width:72px;height:72px;flex:none;border-radius:10px;object-fit:cover;background:#fff;border:1px solid #E3DDD0;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.target-strip .tp-photo img{width:100%;height:100%;object-fit:contain;display:block}
.target-strip .tp-meta{flex:1;min-width:0}
.target-strip .tp-meta b{font-size:14px}
.target-strip .tp-meta .sub{font-size:12px;word-break:break-all}
.img-picked{font-size:12px;color:var(--brand);margin:6px 0;min-height:16px}
.puzzle-code{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center;color:var(--brand);margin:10px 0;font-variant-numeric:tabular-nums}
.link-box{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;color:#343A40;background:#F8F9FA}
.modal.center{text-align:center}
.guess-fb{margin-top:10px;font-size:14px}
.guess-fb .fb.hit{background:#E9FBF2;border:1px solid #B2F2C8;color:#2B8A3E;border-radius:10px;padding:10px 12px}
.guess-fb .fb.miss{background:#FFF5F5;border:1px solid #FFC9C9;color:#C92A2A;border-radius:10px;padding:10px 12px}
.pz-progress{display:flex;gap:6px;margin:10px 0 8px}
.pz-seg{flex:1;text-align:center;padding:8px 4px;border-radius:10px;background:#F1F0EB;color:#868E96;font-size:13px;font-weight:700}
.pz-seg.cur{background:#3B5BDB;color:#fff}
.pz-seg.done{background:#B2F2C8;color:#2B8A3E}
.pz-stage{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px}
.test-tbl{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
.test-tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.test-tbl tr.pass td:first-child{color:#2B8A3E;font-weight:700}
.test-tbl tr.fail td:first-child{color:#C92A2A;font-weight:700}
.hero-actions button{font-size:16px;padding:13px 26px}
/* 顶栏 */
.topbar{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 16px;margin-bottom:14px;flex-wrap:wrap}
.topbar .title{font-weight:700}
.topbar .spacer{flex:1}
.timer{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;background:#F3EFE5;border-radius:10px;padding:6px 14px;min-width:84px;text-align:center}
.timer.urgent{color:var(--bad);background:#FDE8E8}
/* 创作布局 */
.editor{display:grid;grid-template-columns:1fr;gap:14px;justify-items:center}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.editor .wall-panel{width:220px;max-width:100%}
.wall-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1;border-radius:8px;border:2px solid var(--line);background:#FCFBF8;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:contain;display:block}
.cell .coord{position:absolute;left:3px;top:2px;font-size:9px;color:var(--muted);font-family:ui-monospace,monospace;text-shadow:0 0 4px #fff,0 0 4px #fff;z-index:1}
.cell.target{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,168,34,.3)}
.cell.target .coord{color:#B07900;font-weight:700}
.cell.picked{border-color:var(--brand);background:#E7EDFF}
.cell.picked img{opacity:.85}
.cell.correct{border-color:var(--ok);background:#E8F7EC}
.cell.wrong{border-color:var(--bad);background:#FDE8E8}
.cell .mark{position:absolute;right:4px;bottom:2px;font-size:12px;font-weight:800;color:#fff;background:rgba(232,168,34,.92);border-radius:6px;padding:0 6px;z-index:1}
.cell .cross{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--bad);background:rgba(253,232,232,.72);z-index:1}
.target-card{display:flex;flex-direction:column;gap:8px;background:#FFF8E6;border:2px solid var(--gold);border-radius:12px;padding:10px}
.target-card img{width:100%;height:auto;max-height:320px;object-fit:contain;border-radius:10px;display:block}
.target-card .sub{margin-top:2px}
.feed-panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-top:14px;max-width:640px;width:100%}
.feed-panel h2{font-size:15px;margin-bottom:8px}
.feed{display:flex;flex-direction:column;gap:4px;max-height:148px;overflow-y:auto}
.feed-progress{display:flex;gap:8px;align-items:center;justify-content:center;background:#FFF3D6;border:1.5px solid #F2C94C;color:#7A5C00;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;width:100%;max-width:640px;position:sticky;top:56px;z-index:6;box-shadow:var(--shadow)}
@media (min-width:768px){ .feed-progress{display:none} }
@media (max-width:767px){ .feed-panel{margin-top:8px;padding:8px 10px} .feed{max-height:110px} }
.mvp-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.mvp-badge{background:#FFF3D6;border:1.5px solid #F2C94C;color:#7A5C00;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.feed .fitem{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 8px;border-radius:8px;background:#FAF7EF}
.feed .fitem.ok{background:#E8F7EC}
.feed .fitem.no{background:#FDF0EE}
.feed .fitem .tag{font-weight:700;color:#1B7F3B}
.feed .fitem.no .tag{color:#A83226}
.stage-wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.stage{width:100%;max-width:640px;height:auto;background:var(--stage);border-radius:14px;box-shadow:inset 0 0 0 2px var(--line),0 4px 16px rgba(38,48,58,.12);touch-action:none;display:block}
.stage text{user-select:none;font-family:-apple-system,"Apple Color Emoji","Segoe UI Emoji","PingFang SC",sans-serif}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:20px}
/* 画布下方功能条（工具 tabs + 颜色 + 不透明度） */
.tool-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;width:100%;max-width:640px;justify-content:center;padding:12px 14px}
.tb-group{display:flex;flex-direction:column;gap:4px;align-items:center}
.tb-group h3{font-size:11px;color:var(--muted);margin:0;font-weight:600}
.tb-group .note{font-size:12px;color:var(--muted);text-align:center}
.tool-bar .row{display:flex;align-items:center;gap:6px}
.tool-bar .counter{font-size:12px;color:var(--muted);align-self:center;white-space:nowrap}
.tb-note{flex-basis:100%;text-align:center;margin:0}
/* 画布下方操作组 */
.stage-wrap{position:relative}
.canvas-ops{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;width:100%}
.canvas-ops button{padding:5px 10px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#343A40;cursor:pointer}
.canvas-ops button.arm{background:#FFF3E0;border-color:#FFA94D;color:#D9480F;font-weight:700}
.op-state{font-size:10px;color:#868E96;margin-left:6px;white-space:nowrap}
/* 窄屏画布左侧形状栏（2 列竖排，不重叠画布） */
.stage-row{position:relative;display:flex;gap:8px;align-items:flex-start;width:732px;max-width:100%;margin:0 auto}
.stage-row .stage{flex:1;max-width:none;min-width:0}
.shape-rail{display:flex;flex:none;flex-direction:column;gap:4px;padding:6px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.10)}
.shape-rail:not(.open){display:none}
.shape-rail .rail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
.shape-rail button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:8px;background:transparent;padding:0}
.shape-rail button.on{background:#EDF1FF;border-color:var(--brand)}
.shape-rail button svg{width:22px;height:22px}
.shape-rail .rail-col{grid-column:1 / -1;width:100%;height:22px;font-size:10px;color:#868E96;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0}
.shape-rail-mini{display:none;position:absolute;left:6px;top:6px;z-index:5;width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.15);align-items:center;justify-content:center;font-size:16px;color:var(--brand);cursor:pointer}
.shape-rail-mini.show{display:flex}
@media(max-width:600px){
  .stage-row{width:100%}
  .tool-bar{max-width:none}
}
/* 工具箱 */
.tabs{display:flex;gap:4px;margin:0}
.tabs button{padding:6px 14px;font-size:12px;line-height:1.2;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff;font-weight:600}
.swatches{display:flex;gap:5px;margin:0;flex-wrap:wrap;justify-content:center}
.swatch{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.add-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.add-grid button{padding:0;aspect-ratio:1;font-size:20px;line-height:1}
.shape-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.shape-grid button{padding:3px 2px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#fff;border:1px solid var(--line);border-radius:8px}
.shape-grid button.on{border-color:var(--brand);background:#EDF1FF}
.shape-grid svg{width:32px;height:32px}
.shape-grid button b{font-size:9px;font-weight:600;color:#495057;line-height:1}
.shape-grid button.on b{color:var(--brand)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row button{flex:1;white-space:nowrap}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:6px}
.counter b{color:var(--ink)}
/* 猜题 */
.guess-stage{max-width:460px;margin:0 auto}
.qbar{text-align:center;margin:6px 0 14px;font-weight:600}
.wall-big{max-width:520px;margin:14px auto 0}
.wall-big .cell{aspect-ratio:1}
.wall-big .cell .coord{font-size:11px}
.confirm-bar{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:16px;min-height:46px;flex-wrap:wrap}
.guess-record{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:#FCFBF8;border:1px solid var(--line);font-size:13px;margin-top:6px}
.guess-record b{margin-left:auto;font-weight:700}
.guess-record.hit b{color:var(--ok)}
.guess-record.miss b{color:var(--bad)}
.guess-record.pending b{color:#B45309}
/* 揭晓 */
.score-big{font-size:40px;font-weight:800;color:var(--brand);text-align:center;margin:6px 0}
.review-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;background:#FCFBF8;margin-bottom:8px;border:1px solid var(--line)}
.review-item svg{width:64px;height:64px;flex:none;border-radius:8px;background:#fff;border:1px solid var(--line)}
.review-item .res{margin-left:auto;font-weight:700;white-space:nowrap}
.answer-img{display:flex;justify-content:center;margin:12px 0}
.answer-img img{max-width:220px;max-height:220px;width:auto;height:auto;object-fit:contain;border-radius:14px;border:2px solid var(--gold);box-shadow:var(--shadow)}
.foot-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.link-row{display:flex;gap:8px;margin:12px 0}
.link-row input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;font-family:ui-monospace,monospace;background:#FCFBF8;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#26303A;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--muted);background:#F3EFE5;border-radius:10px;padding:8px 12px;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:#F3EFE5}
@media(max-width:860px){
  .editor{grid-template-columns:1fr}
  .wall-grid{grid-template-columns:repeat(8,1fr)}
  .rule-grid{grid-template-columns:1fr}
  /* ---- 移动端优化 ---- */
  .wrap{padding:10px}
  .topbar{gap:8px;padding:8px 10px;border-radius:12px}
  .topbar .tag{display:none}
  .topbar .title{font-size:15px}
  .topbar .timer{font-size:16px;padding:4px 10px;min-width:auto}
  .topbar button{padding:7px 10px;font-size:13px}
  .editor{gap:10px}

/* ================= 共享配置源（与服务端同一 ruleset） ================= */

/* ================= 工具函数 ================= */

let toastTimer;
function toast(msg){ $toast.textContent=msg; $toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$toast.classList.remove("show"),2200); }
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function coordLabel(i){return "ABCD"[Math.floor(i/RULES.gridW)] + ((i%RULES.gridW)+1);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function h(tag, attrs={}, ...kids){
  const el=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const k in attrs) el.setAttribute(k,attrs[k]);
  for(const kid of kids){ if(kid==null) continue; el.appendChild(typeof kid==="string"?document.createTextNode(kid):kid); }
  return el;
}
function html(tag, attrs={}, htmlStr){
  const e=document.createElement(tag);
  for(const k in attrs){ if(k==="class")e.className=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); }
  if(htmlStr!=null) e.innerHTML=htmlStr;
  return e;
}

/* ================= 轻量音效（Web Audio 合成，无素材文件；音量克制，供氛围提示） ================= */
function sfx(name){
  if(sfx._mute) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=sfx._ctx||(sfx._ctx=new AC());
    if(ctx.state==="suspended") ctx.resume();
    const now=ctx.currentTime;
    const tone=(hz,vol,dur,type,delay)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type||"sine"; o.frequency.value=hz;
      g.gain.setValueAtTime(0.0001,now+delay);
      g.gain.linearRampToValueAtTime(vol,now+delay+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,now+delay+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+delay); o.stop(now+delay+dur+0.05);
    };
    const P={
      hit:()=>{ tone(659,0.15,0.16,"sine",0); tone(880,0.13,0.22,"sine",0.08); },
      win:()=>{ tone(523,0.14,0.13,"sine",0); tone(659,0.14,0.13,"sine",0.07); tone(784,0.15,0.22,"sine",0.14); },
      miss:()=>{ tone(196,0.11,0.18,"triangle",0); },
      tick:()=>{ tone(1046,0.05,0.05,"square",0); },
      reveal:()=>{ tone(392,0.15,0.26,"sine",0); tone(523,0.15,0.26,"sine",0.11); tone(659,0.15,0.3,"sine",0.22); tone(784,0.14,0.42,"sine",0.33); },
      pick:()=>{ tone(784,0.15,0.13,"sine",0); tone(1047,0.13,0.18,"sine",0.06); }
    };
    if(P[name]) P[name]();
  }catch(_){}
}
/* ================= 作品渲染（创作/实时观看/揭晓共用） ================= */
function shapeFor(e){
  const g = h("g",{transform:`translate(${e.x} ${e.y}) rotate(${e.rot||0})`,"data-kind":e.kind});
  const op=typeof e.opacity==="number"?e.opacity:1;
  const col=e.color||"#E03131";
  const w=e.w||80, hh=e.h||80;
  if(e.kind==="rect"||e.kind==="square") g.appendChild(h("rect",{x:-w/2,y:-hh/2,width:w,height:hh,rx:3,fill:col,opacity:op}));
  else if(e.kind==="bar") g.appendChild(h("rect",{x:-w/2,y:-hh/2,width:w,height:hh,rx:2,fill:col,opacity:op}));
  else if(e.kind==="cross"){
    g.appendChild(h("rect",{x:-w/2,y:-hh/6,width:w,height:hh/3,fill:col,opacity:op}));
    g.appendChild(h("rect",{x:-w/6,y:-hh/2,width:w/3,height:hh,fill:col,opacity:op}));
  }
  else if(e.kind==="circle") g.appendChild(h("circle",{r:w/2,fill:col,opacity:op}));
  else if(e.kind==="ellipse") g.appendChild(h("ellipse",{cx:0,cy:0,rx:w/2,ry:hh/2,fill:col,opacity:op}));
  else if(e.kind==="semicircle") g.appendChild(h("path",{d:`M${-w/2},0 A${w/2} ${w/2} 0 0 1 ${w/2},0 Z`,fill:col,opacity:op}));
  else if(e.kind==="triangle") g.appendChild(h("polygon",{points:`0,${-hh/2} ${-w/2},${hh/2} ${w/2},${hh/2}`,fill:col,opacity:op}));
  else if(e.kind==="diamond") g.appendChild(h("polygon",{points:`0,${-hh/2} ${w/2},0 0,${hh/2} ${-w/2},0`,fill:col,opacity:op}));
  else if(e.kind==="crescent") g.appendChild(h("path",{d:`M0,${-w/2} A${w/2} ${w/2} 0 1 1 0,${w/2} A${w*0.35} ${w*0.35} 0 0 0 0,${-w/2} Z`,fill:col,opacity:op,"fill-rule":"evenodd"}));
  else if(e.kind==="star"){
    const sr=w/2, sir=sr*0.382; let sd="";
    for(let i=0;i<10;i++){ const a=(90+i*36)*Math.PI/180; const rr=(i%2===0)?sr:sir; const sx=rr*Math.cos(a), sy=-rr*Math.sin(a); sd+=(i===0?"M":"L")+sx.toFixed(1)+","+sy.toFixed(1); }
    g.appendChild(h("path",{d:sd+"Z",fill:col,opacity:op}));
  }
  else if(e.kind==="waterdrop") g.appendChild(h("path",{d:`M0,${-hh/2} Q${w/2},${-hh*0.05} ${w/2},${hh*0.22} A${w/2} ${hh*0.55} 0 1 1 ${-w/2},${hh*0.22} Q${-w/2},${-hh*0.05} 0,${-hh/2} Z`,fill:col,opacity:op}));
  else if(e.kind==="arrow"){
    g.appendChild(h("rect",{x:-w/2,y:-hh*0.12,width:w*0.72,height:hh*0.24,fill:col,opacity:op}));
    g.appendChild(h("polygon",{points:`${w*0.22},${-hh*0.42} ${w/2},0 ${w*0.22},${hh*0.42}`,fill:col,opacity:op}));
  }
  else if(e.kind==="icon"){
    const t=h("text",{x:0,y:0,"text-anchor":"middle","dominant-baseline":"central","font-size":hh,opacity:op});
    t.textContent=e.glyph; g.appendChild(t);
  }
  else if(e.kind==="path"){
    g.appendChild(h("path",{d:e.d,fill:"none",stroke:col,"stroke-width":e.width||3,"stroke-linecap":"round","stroke-linejoin":"round",opacity:op}));
  }
  return g;
}
function shapeIcon(kind, color){
  const s0=SHAPES.find(s=>s.kind===kind);
  const iw=36, ih=36;
  const sw=s0?Math.max(1,s0.w):iw, sh=s0?Math.max(1,s0.h):ih;
  const scale=Math.min(iw/sw, ih/sh);
  const w=Math.max(3,sw*scale), h=Math.max(3,sh*scale);
  const svgEl=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svgEl.setAttribute("viewBox","0 0 56 56");
  svgEl.appendChild(shapeFor({kind,x:28,y:28,w,h,rot:0,color:color||"#3B5BDB"}));
  return svgEl.outerHTML;
}
function renderArtwork(svg, els, opts={}){
  svg.innerHTML="";
  svg.setAttribute("viewBox",`0 0 ${STAGE} ${STAGE}`);
  svg.style.height=svg.getBoundingClientRect().width+"px";
  svg.appendChild(h("rect",{x:0,y:0,width:STAGE,height:STAGE,fill:opts.bg||"#FBFAF6"}));
  els.forEach(e=>svg.appendChild(shapeFor(e)));
}

function route(){

  const [path,query=""]=hash.slice(1).split("?");
  const params=Object.fromEntries(new URLSearchParams(query));
  const parts=path.split("/").filter(Boolean);
  if(path==="/"||path==="/home"||parts.length===0) renderHome();
  else if(parts[0]==="online") renderOnline();
  else if(parts[0]==="onlinetest") runOnlineTest();
  else if(parts[0]==="puzzletest") runPuzzleTest();
  else if(parts[0]==="puzzle"){
    if(parts[1]) renderPuzzleGuess(parts[1]);
    else renderPuzzleEditor();
  }
  else if(parts[0]==="mylib") renderMyLib();
  else renderHome();
  window.scrollTo(0,0);
}

/* ===== 自定义图片库（IndexedDB 本地持久化，单机+联机共用） ===== */
const CUSTOM_DB="pw-custom-images", CUSTOM_STORE="images";
const GAME_DB="pw-game-cache", GAME_STORE="images", GAME_CAP=200;   // 对局收藏：独立 store，上限 200 张 FIFO
/* 图片内容指纹：SHA-256（secure context 可用），失败回退字符串哈希。
   同一张图无论压缩几次，指纹稳定，用于跨端判重（房间去重/已上传标记/对局收藏去重） */
async function imgFp(dataURL){
  try{
    const buf = await (await fetch(String(dataURL||""))).arrayBuffer();
    const d = await crypto.subtle.digest("SHA-256", buf);
    return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,16);
  }catch(e){
    let h=5381; const s=String(dataURL||"");
    for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; }
    return "fb"+h.toString(16);
  }
}
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(CUSTOM_DB,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(CUSTOM_STORE)) r.result.createObjectStore(CUSTOM_STORE,{keyPath:"id"}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function customList(){
  const db=await idbOpen();
  return new Promise((res,rej)=>{ const tx=db.transaction(CUSTOM_STORE,"readonly").objectStore(CUSTOM_STORE).getAll(); tx.onsuccess=()=>res(tx.result||[]); tx.onerror=()=>rej(tx.error); });
}
async function customPut(item){
  /* 写入校验：图片必须是合法的 data:image URL，防止坏记录进图库 */
  const img=String(item&&item.img||"");
  if(!/^data:image\/[a-zA-Z0-9.+-]+;base64,/.test(img) || img.length<64 || img.length>1.5e6) throw new Error("invalid image");
  const db=await idbOpen();
  return new Promise((res,rej)=>{ const tx=db.transaction(CUSTOM_STORE,"readwrite").objectStore(CUSTOM_STORE).put(item); tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); });
}
async function customDel(id){
  const db=await idbOpen();
  return new Promise((res,rej)=>{ const tx=db.transaction(CUSTOM_STORE,"readwrite").objectStore(CUSTOM_STORE).delete(id); tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); });
}
/* ---- 对局收藏：独立 IndexedDB，只存对局中见过的房间自定义图（系统 64 图不收藏），上限 GAME_CAP 张 FIFO ---- */
function idbGameOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(GAME_DB,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(GAME_STORE)) r.result.createObjectStore(GAME_STORE,{keyPath:"id"}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function gameList(){
  const db=await idbGameOpen();
  return new Promise((res,rej)=>{ const tx=db.transaction(GAME_STORE,"readonly").objectStore(GAME_STORE).getAll(); tx.onsuccess=()=>res((tx.result||[]).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))); tx.onerror=()=>rej(tx.error); });
}
async function gamePut(item){
  const img=String(item&&item.img||"");
  if(!/^data:image\/[a-zA-Z0-9.+-]+;base64,/.test(img) || img.length<64 || img.length>1.5e6) throw new Error("invalid image");
  const db=await idbGameOpen();
  await new Promise((res,rej)=>{ const tx=db.transaction(GAME_STORE,"readwrite").objectStore(GAME_STORE).put(item); tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); });
  /* FIFO：超出上限删除最旧 */
  const all=await gameList();
  if(all.length>GAME_CAP){
    const stale=all.slice(GAME_CAP);
    const db2=await idbGameOpen();
    await new Promise((res,rej)=>{ const tx=db2.transaction(GAME_STORE,"readwrite").objectStore(GAME_STORE); stale.forEach(x=>tx.objectStore(GAME_STORE).delete(x.id)); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
  }
  return item;
}
async function gameDel(id){
  const db=await idbGameOpen();
  return new Promise((res,rej)=>{ const tx=db.transaction(GAME_STORE,"readwrite").objectStore(GAME_STORE).delete(id); tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); });
}
async function gameClear(){
  const db=await idbGameOpen();
  return new Promise((res,rej)=>{ const tx=db.transaction(GAME_STORE,"readwrite").objectStore(GAME_STORE).clear(); tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); });
}
/* 自动收藏：把对局照片墙里的房间自定义图写入收藏（按指纹去重，系统图跳过） */
async function gameCollect(wall){
  if(!Array.isArray(wall)) return;
  for(const g of wall){
    if(!g || !String(g.img||"").startsWith("data:image/")) continue;   // 只收房间自定义图（dataURL），系统图不收藏
    try{
      const fp = await imgFp(g.img);
      await gamePut({ id:"gp-"+fp, fp, img:g.img, zh:g.zh||"我的图片", category:g.category||"自定义", exact:g.exact||"", keywords:g.keywords||[], aliases:g.aliases||[], category_word:g.category_word||"", contributor:g.contributor||"", createdAt:Date.now() });
    }catch(_){}
  }
}

/* ===== 图片裁剪对话框：1:1 / 4:3 / 3:4 / 自由；拖框+底图缩放；返回原尺寸 JPEG dataURL，取消返回 null ===== */
function clampNum(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function cropImageDialog(raw){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const iw=im.naturalWidth, ih=im.naturalHeight;
      const STAGE_H=Math.min(360, Math.round((window.innerHeight||800)*0.55));
      const mk=html("div",{class:"mask"});
      mk.innerHTML=`<div class="pop" style="max-width:480px;width:calc(100vw - 40px)">
        <h3>裁剪图片</h3>
        <div class="row" style="gap:6px;flex-wrap:wrap" id="crop-ratios">
          <button class="ghost" data-r="1" style="min-width:52px;background:var(--brand);color:#fff;border-color:var(--brand)">1:1</button>
          <button class="ghost" data-r="4/3" style="min-width:52px">4:3</button>
          <button class="ghost" data-r="3/4" style="min-width:52px">3:4</button>
          <button class="ghost" data-r="" style="min-width:52px">自由</button>
          <div class="sub" style="align-self:center;margin-left:6px">选择构图比例，拖动裁剪框</div>
        </div>
        <div id="crop-stage" style="position:relative;overflow:hidden;border-radius:12px;background:repeating-conic-gradient(#ECE7DA 0 25%, #FFFDF6 0 50%) 0 0/18px 18px;border:1px solid var(--line);margin-top:8px"></div>
        <div class="row" style="margin-top:10px;justify-content:center;gap:10px">
          <button class="ghost" id="crop-zo">－ 缩小</button>
          <button class="ghost" id="crop-zi">放大 ＋</button>
          <div class="sub" style="align-self:center">也可滚动滚轮缩放 · 拖动图片移动</div>
        </div>
        <div class="row" style="margin-top:12px;align-items:center">
          <div id="crop-pv" style="flex:none;width:72px;height:72px;border:2px solid var(--gold);border-radius:10px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center"><img alt="预览" style="max-width:100%;max-height:100%;object-fit:contain"></div>
          <div class="sub" style="flex:1;padding:0 10px">裁剪后的图片按所选比例完整展示，不再被二次裁切</div>
          <button class="ghost" id="crop-no">取消</button>
          <button class="primary" id="crop-ok" style="margin-left:8px">确认裁剪</button>
        </div>
      </div>`;
      document.body.appendChild(mk);
      const stage=mk.querySelector("#crop-stage");
      const sw=Math.min(440, (stage.parentElement.clientWidth||440)-32), sh=STAGE_H;
      stage.style.width=sw+"px"; stage.style.height=sh+"px";
      const img=html("img");
      img.src=raw; img.style.position="absolute"; img.style.userSelect="none"; img.style.touchAction="none";
      img.style.width=iw+"px"; img.style.height=ih+"px"; img.style.transformOrigin="0 0"; img.style.cursor="move";
      stage.appendChild(img);
      const box=html("div");
      box.style.cssText="position:absolute;border:2px solid #fff;outline:1px solid rgba(0,0,0,.35);box-shadow:0 0 0 9999px rgba(0,0,0,.35);cursor:move;touch-action:none;background:transparent";
      stage.appendChild(box);
      const grip=html("div");
      grip.style.cssText="position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:var(--brand);border:2px solid #fff;border-radius:4px;cursor:nwse-resize;touch-action:none";
      box.appendChild(grip);
      let ratio="1", bs=0, tx=0, ty=0;
      const bs0=Math.min((sw-16)/iw,(sh-16)/ih);
      function applyImg(){ img.style.transform=`translate(${tx}px,${ty}px) scale(${bs})`; }
      function applyBox(){ box.style.left=box.x+"px"; box.style.top=box.y+"px"; box.style.width=box.w+"px"; box.style.height=box.h+"px"; }
      function resetView(){
        bs=bs0; tx=(sw-iw*bs)/2; ty=(sh-ih*bs)/2;
        const cx=sw/2, cy=sh/2, s=Math.min(sw,sh)*0.68;
        box.w=s; box.h=s; box.x=cx-s/2; box.y=cy-s/2;
        applyImg(); applyBox(); syncRatioBtns(); refreshPv();
      }
      function syncRatioBtns(){
        mk.querySelectorAll("#crop-ratios button").forEach(b=>{
          b.style.background=(b.dataset.r===ratio)?"var(--brand)":"";
          b.style.color=(b.dataset.r===ratio)?"#fff":"";
          b.style.borderColor=(b.dataset.r===ratio)?"var(--brand)":"";
        });
      }
      function setRatio(r){
        ratio=r;
        const cx=box.x+box.w/2, cy=box.y+box.h/2;
        let w,h;
        const maxW=sw-4, maxH=sh-4;
        if(r==="1"){ const s=Math.min(maxW,maxH)*0.78; w=h=s; }
        else if(r==="4/3"){ w=Math.min(maxW,maxH)*0.82; h=w*3/4; }
        else if(r==="3/4"){ h=Math.min(maxW,maxH)*0.82; w=h*3/4; }
        else { w=Math.min(maxW,box.w); h=Math.min(maxH,box.h); }
        box.w=w; box.h=h; box.x=clampNum(cx-w/2,0,sw-w); box.y=clampNum(cy-h/2,0,sh-h);
        applyBox(); syncRatioBtns(); refreshPv();
      }
      function refreshPv(){
        const out=exportCrop(true);
        if(out){ mk.querySelector("#crop-pv img").src=out; }
      }
      function exportCrop(skipToast){
        const sx=(box.x-tx)/bs, sy=(box.y-ty)/bs;
        const cx0=clampNum(sx,0,iw), cy0=clampNum(sy,0,ih);
        const ew=Math.min(iw-cx0, box.w/bs), eh=Math.min(ih-cy0, box.h/bs);
        if(ew<2||eh<2){ if(!skipToast) toast("裁剪区域超出图片，请调整裁剪框"); return null; }
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(ew)); c.height=Math.max(1,Math.round(eh));
        c.getContext("2d").drawImage(im, cx0,cy0,ew,eh, 0,0,c.width,c.height);
        return c.toDataURL("image/jpeg",0.92);
      }
      /* 拖拽（框 / 手柄 / 底图） */
      let drag=null;
      stage.addEventListener("pointerdown",ev=>{
        if(ev.target===grip){
          ev.preventDefault(); ev.stopPropagation();
          try{ stage.setPointerCapture(ev.pointerId); }catch(_){}
          const rw=box.w, rh=box.h;
          drag={type:"grip",sx:ev.clientX,sy:ev.clientY,ow:rw,oh:rh};
        } else if(ev.target===box){
          ev.preventDefault();
          try{ stage.setPointerCapture(ev.pointerId); }catch(_){}
          drag={type:"box",sx:ev.clientX,sy:ev.clientY,ox:box.x,oy:box.y};
        } else if(ev.target===img){
          ev.preventDefault();
          try{ stage.setPointerCapture(ev.pointerId); }catch(_){}
          drag={type:"img",sx:ev.clientX,sy:ev.clientY,otx:tx,oty:ty};
        }
      });
      stage.addEventListener("pointermove",ev=>{
        if(!drag) return;
        const dx=ev.clientX-drag.sx, dy=ev.clientY-drag.sy;
        if(drag.type==="box"){
          box.x=clampNum(drag.ox+dx,0,sw-box.w); box.y=clampNum(drag.oy+dy,0,sh-box.h);
          applyBox();
        } else if(drag.type==="img"){
          tx=clampNum(drag.otx+dx, sw-iw*bs, 0); ty=clampNum(drag.oty+dy, sh-ih*bs, 0);
          applyImg();
        } else if(drag.type==="grip"){
          let nw,nh;
          if(ratio===""){ nw=clampNum(drag.ow+dx,40,sw); nh=clampNum(drag.oh+dy,40,sh); }
          else{
            const rv=ratio==="1"?1:(ratio==="4/3"?4/3:3/4);
            nw=clampNum(drag.ow+dx,40,sw); nh=nw/rv;
            if(nh>sh){ nh=sh; nw=nh*rv; }
          }
          box.w=nw; box.h=nh;
          box.x=clampNum(box.x,0,sw-nw); box.y=clampNum(box.y,0,sh-nh);
          applyBox();
        }
      });
      stage.addEventListener("pointerup",()=>{ if(drag){ drag=null; refreshPv(); } });
      stage.addEventListener("wheel",ev=>{
        ev.preventDefault();
        const f=ev.deltaY<0?1.1:1/1.1;
        bs=clampNum(bs*f, bs0*0.9, 10);
        tx=clampNum(tx, sw-iw*bs, 0); ty=clampNum(ty, sh-ih*bs, 0);
        applyImg();
      },{passive:false});
      mk.querySelector("#crop-zo").onclick=()=>{ bs=clampNum(bs/1.15, bs0*0.9, 10); tx=clampNum(tx, sw-iw*bs, 0); ty=clampNum(ty, sh-ih*bs, 0); applyImg(); };
      mk.querySelector("#crop-zi").onclick=()=>{ bs=clampNum(bs*1.15, bs0*0.9, 10); tx=clampNum(tx, sw-iw*bs, 0); ty=clampNum(ty, sh-ih*bs, 0); applyImg(); };
      mk.querySelectorAll("#crop-ratios button").forEach(b=>b.onclick=()=>setRatio(b.dataset.r));
      mk.querySelector("#crop-no").onclick=()=>{ mk.remove(); res(null); };
      mk.querySelector("#crop-ok").onclick=()=>{
        const out=exportCrop(false);
        if(out){ mk.remove(); res(out); }
      };
      resetView();
    };
    im.onerror=()=>res(null);
    im.src=raw;
  });
}

function fileToDataURL(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(file); });
}
function compressImage(dataURL, maxSide, quality){
  /* 降级重试：512/0.82 → 384/0.72 → 256/0.65，全部失败返回 null（调用方拒绝，不再回退原图） */
  maxSide=maxSide||512; quality=quality||0.82;
  const tries=[[maxSide,quality],[Math.min(maxSide,384),0.72],[Math.min(maxSide,256),0.65]];
  return new Promise((res)=>{
    const im=new Image();
    im.onload=()=>{
      const step=(i)=>{
        if(i>=tries.length){ res(null); return; }
        try{
          const [side,q]=tries[i];
          const k=Math.min(1, side/Math.max(im.width,im.height));
          const c=document.createElement("canvas");
          c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
          c.getContext("2d").drawImage(im,0,0,c.width,c.height);
          const out=c.toDataURL("image/jpeg",q);
          res(out.length>1.5e6 ? step(i+1) : out);
        }catch(e){ step(i+1); }
      };
      step(0);
    };
    im.onerror=()=>res(null);
    im.src=dataURL;
  });
}

async function renderPuzzleGuess(id){
  $app.innerHTML="";
  const wrap=html("div",{class:"wrap"});
  wrap.innerHTML=`
  <div class="topbar">
    <button class="ghost" id="back">← 首页</button>
    <span class="title">猜谜 · ${esc(id)}</span>
    <span class="spacer"></span>
  </div>
  <div class="stage-wrap" style="max-width:560px;margin:0 auto">
    <svg class="stage" id="stage"></svg>
    <div class="hint" id="hint">看看这幅画，猜猜作者画的是什么</div>
  </div>
  <div class="card" style="max-width:560px;margin:12px auto">
    <div class="pz-progress" id="pz-progress"></div>
    <div class="pz-stage" id="pz-stage"></div>
    <div class="row" id="guess-row">
      <input id="guess-input" placeholder="输入你的猜测…" autocomplete="off">
      <button class="primary" id="guess-send">猜</button>
    </div>
    <div id="guess-fb" class="guess-fb"></div>
  </div>`;
  $app.appendChild(wrap);
  wrap.querySelector("#back").onclick=()=>location.hash="#/";
  const fbEl=wrap.querySelector("#guess-fb");
  const progressEl=wrap.querySelector("#pz-progress"), stageEl=wrap.querySelector("#pz-stage");
  let data=null;
  try{
    const r=await fetch("/api/puzzle/"+encodeURIComponent(id));
    if(r.status===404){ fbEl.innerHTML=`<div class="fb miss">这个谜题不存在或已过期（谜题 24 小时后自动清理）。</div>`; return; }
    data=await r.json();
  }catch(e){ fbEl.innerHTML=`<div class="fb miss">加载失败，请检查网络后刷新。</div>`; return; }
  const svg=wrap.querySelector("#stage");
  renderArtwork(svg,data.canvas,{bg:data.bg||"#FFFFFF"});
  const hint=wrap.querySelector("#hint");
  hint.textContent=`作者画了 ${data.canvas.length} 个元素 · 三关猜谜：类别 → 联想 → 准确`;
  const input=wrap.querySelector("#guess-input"), send=wrap.querySelector("#guess-send");
  const STAGES=["category","keyword","exact"];
  const STAGE_LABEL={category:"类别",keyword:"联想",exact:"准确"};
  const STAGE_PLACEHOLDER={category:"先猜它属于哪一类，如：动物",keyword:"很棒！再猜一个联想词，如：草原",exact:"快接近了！猜出准确名字，如：长颈鹿"};
  let stage=0, done=false;
  function renderProgress(){
    progressEl.innerHTML="";
    STAGES.forEach((st,i)=>{
      const seg=html("div",{class:"pz-seg"+(i<stage?" done":"")+(i===stage?" cur":"")});
      seg.textContent=i<stage?"✓ "+STAGE_LABEL[st]:STAGE_LABEL[st];
      progressEl.appendChild(seg);
    });
    stageEl.textContent=done?"🎉 恭喜通关！":`第 ${stage+1} 关 · 猜${STAGE_LABEL[STAGES[stage]]}`;
    input.placeholder=done?"已通关":STAGE_PLACEHOLDER[STAGES[stage]];
    input.disabled=done; send.disabled=done;
    send.textContent=done?"已通关":"猜";
  }
  function doGuess(){
    const text=input.value.trim();
    if(!text||done) return;
    send.disabled=true;
    fetch("/api/puzzle/"+encodeURIComponent(id)+"/guess",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,stage:STAGES[stage]})})
      .then(r=>r.json()).then(j=>{
        send.disabled=false;
        if(j.err){ fbEl.innerHTML=`<div class="fb miss">谜题不存在或已过期。</div>`; return; }
        if(j.done || (j.correct&&j.answer)){
          done=true;
          let ansText="";
          if(j.answer && j.answer.mode==="image") ansText=`谜底是「${j.answer.zh}」（${j.answer.category}）`;
          else if(j.answer && j.answer.mode==="custom_image") ansText=`谜底是「${j.answer.exact}」（自定义图片）`;
          else if(j.answer && j.answer.mode==="custom") ansText=`谜底是「${j.answer.words.join(" / ")}」`;
          else ansText="答对了";
          let imgHtml="";
          if(j.answer && j.answer.img) imgHtml=`<img src="${j.answer.img}" alt="谜底照片" style="width:100%;max-width:300px;border-radius:12px;margin-top:10px;display:block">`;
          fbEl.innerHTML=`<div class="fb hit">🎉 答对了！${ansText}${imgHtml}</div>`;
          sfx("win");
          stage=3; renderProgress();
          return;
        }
        if(j.passed){
          const ni=STAGES.indexOf(j.next);
          stage=ni>=0?ni:stage+1;
          fbEl.innerHTML=`<div class="fb hit">🎯 命中${STAGE_LABEL[j.level]||""}「${esc(j.word)}」！进入下一关</div>`;
          sfx("hit");
          renderProgress();
          return;
        }
        if(j.hint){
          fbEl.innerHTML=`<div class="fb miss">${j.hint==="category"?"这只是类别，再具体一点！":"接近了！这属于联想词，想想它的准确名字"}</div>`;
          sfx("miss");
          return;
        }
        fbEl.innerHTML=`<div class="fb miss">不对哦，再想想～</div>`;
        sfx("miss");
      }).catch(()=>{ send.disabled=false; fbEl.innerHTML=`<div class="fb miss">网络错误，请重试。</div>`; });
  }
  renderProgress();
  send.onclick=doGuess;
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") doGuess(); });
}

      if(drag.pts.length>=2){
        const xs=drag.pts.map(q=>q[0]),ys=drag.pts.map(q=>q[1]);
        const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
        const w=Math.max(12,Math.max(...xs)-Math.min(...xs)), h=Math.max(12,Math.max(...ys)-Math.min(...ys));
        const d=smoothPath(drag.pts.map(q=>[q[0]-cx,q[1]-cy]));
        state.els.push({kind:"path",x:cx,y:cy,w,h,rot:0,color:state.color,width:state.strokeW,d});
        if(state.els.length>RULES.elementCap){state.els.pop();toast(`单作品元素上限 ${RULES.elementCap} 个`);}
        state.selected=state.els.length-1;
      } else { state.history.pop(); }
      syncUI();
    }
    drag=null;
  });
  function clamp(e){ e.x=Math.max(0,Math.min(STAGE,e.x)); e.y=Math.max(0,Math.min(STAGE,e.y)); }
  function drawTempPath(){
    draw();
    const d=smoothPath(drag.pts);
    svg.appendChild(h("path",{d,fill:"none",stroke:state.color,"stroke-width":state.strokeW,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.8}));
  }
  function smoothPath(pts){
    if(pts.length===2) return `M${pts[0][0]},${pts[0][1]} L${pts[1][0]},${pts[1][1]}`;
    let d=`M${pts[0][0]},${pts[0][1]}`;
    for(let i=1;i<pts.length-1;i++){
      const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
      d+=` Q${pts[i][0]},${pts[i][1]} ${mx},${my}`;
    }
    const last=pts[pts.length-1]; d+=` L${last[0]},${last[1]}`;
    return d;
  }

  /* 按钮操作 */
  wrap.querySelector("#del").onclick=()=>{if(state.selected==null)return;commit();state.els.splice(state.selected,1);state.selected=null;syncUI();};
  wrap.querySelector("#up").onclick=()=>{if(state.selected==null)return;commit();const e=state.els.splice(state.selected,1)[0];state.els.push(e);state.selected=state.els.length-1;syncUI();};
  wrap.querySelector("#down").onclick=()=>{if(state.selected==null)return;commit();const e=state.els.splice(state.selected,1)[0];state.els.unshift(e);state.selected=0;syncUI();};
  wrap.querySelector("#undo").onclick=()=>{if(!state.history.length)return;state.future.push(JSON.stringify(state.els));state.els=JSON.parse(state.history.pop());state.selected=null;syncUI();};
  wrap.querySelector("#redo").onclick=()=>{if(!state.future.length)return;state.history.push(JSON.stringify(state.els));state.els=JSON.parse(state.future.pop());state.selected=null;syncUI();};
  let clearArmed=false, clearTimer=null;
  wrap.querySelector("#clear").onclick=()=>{
    const b=wrap.querySelector("#clear");
    if(!clearArmed){
      clearArmed=true; b.classList.add("arm"); b.textContent="再点确认清空";
      clearTimer=setTimeout(()=>{clearArmed=false;b.classList.remove("arm");b.textContent="清空";},3000);
      return;
    }
    clearTimeout(clearTimer); clearArmed=false; b.classList.remove("arm"); b.textContent="清空";
    commit(); state.els=[]; state.selected=null; state.ghost=null; state.ghostShape=null; document.removeEventListener("pointermove",followGhost); syncUI();
  };
  window.addEventListener("keydown",function kd(ev){
    if(!$app.contains(svg)){window.removeEventListener("keydown",kd);return;}
    if(ev.key==="Delete"&&state.selected!=null){wrap.querySelector("#del").click();}
    if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="z"){ev.preventDefault();ev.shiftKey?wrap.querySelector("#redo").click():wrap.querySelector("#undo").click();}
  });

  /* 计时：最后 30 秒画布红框警示 + 最后 10 秒滴答音 */
  timerId=setInterval(()=>{
    if(state.finished){clearInterval(timerId);return;}
    const left=Math.max(0,Math.ceil((__PW.deadline-Date.now())/1000));
    const mm=Math.floor(left/60),ss=left%60;
    timerEl.textContent=`${mm}:${String(ss).padStart(2,"0")}`;
    timerEl.classList.toggle("urgent",left<=30);
    wrap.querySelector(".stage-wrap").classList.toggle("time-warn",left<=30);
    if(left>0 && left<=10){ if(sfx._lastTick!==left){ sfx._lastTick=left; sfx("tick"); } }
    else { sfx._lastTick=null; }
  },1000);
  /* 作答动态：出题人实时看到每个猜词与选图对错（word_view/guess_view 仅发给出题人） */
  function renderFeedProgress(){
    const el=document.querySelector("#feed-progress"); if(!el) return;
    const total=Math.max(0,(__PW.players||[]).length-1);
    el.innerHTML=`🎯 准确词命中 <b>${(__PW.exactHits||[]).length}/${total}</b>`;
  }
  window.__pwFeedProgress=renderFeedProgress;
  renderFeedProgress();
  function addFeed(inner, cls){
    const feed=document.querySelector("#feed"); if(!feed) return;
    const it=document.createElement("div");
    it.className="fitem "+(cls||"");
    it.innerHTML=inner;
    feed.appendChild(it);
    while(feed.children.length>8) feed.removeChild(feed.firstChild);
    feed.scrollTop=feed.scrollHeight;
  }
  window.__pwDrawerWord=(m)=>{
    if(m.correct){
      if(m.level==="exact" && !m.repeat && !(__PW.exactHits||[]).includes(m.pid)){
        __PW.exactHits=(__PW.exactHits||[]).concat(m.pid);
        renderFeedProgress();
      }
      const tag=m.repeat?`已猜中「${esc(m.word)}」`:`「${esc(m.word)}」✓ ${levelLabel(m.level)}`;
      addFeed(`<b>${esc(m.nickname)}</b><span class="tag">${tag}</span>`,"ok");
      if(!m.repeat) sfx("hit");
    }else{
      addFeed(`<b>${esc(m.nickname)}</b><span class="tag">猜「${esc(m.word)}」✗</span>`,"no");
      sfx("miss");
    }
  };
  window.__pwDrawerGuess=(m)=>{
    const cell=coordLabel(m.cell);
    if(m.correct){ addFeed(`<b>${esc(m.nickname)}</b><span class="tag">选 ${cell} ✓${m.first?" 首答":""}</span>`,"ok"); sfx(m.first?"win":"pick"); }
    else { addFeed(`<b>${esc(m.nickname)}</b><span class="tag">选 ${cell} ✗</span>`,"no"); sfx("miss"); }
  };
  syncUI();
  window.__pwEditor={state,svg,wrap,draw};
  function onlineTarget(){ return Number.isInteger(target) && target>=0 && wall[target]; }
}

/* ================= 联机对战（#/online，规则集 pictures-web-online-v1） ================= */
const PW_WS_URL = (location.protocol==="file:" ? "ws://localhost:4000/ws" : (location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
const __PW = window.__pwOnline = {
  ws:null, roomId:"", pid:"", nickname:"", status:"lobby", role:"",
  wall:[], target:-1, deadline:0, canvas:[], canvasBg:"#FFFFFF", scores:{},
  round:0, maxRounds:0, drawer:{pid:"",nickname:""},
  createSeconds:120, lockSeconds:60, answered:0, total:0,
  poolMode:"mixed", customImgs:[], exactHits:[],
  hostPid:"", players:[], reveal:null, over:null, _connFailed:false,
  send(o){
    if(this.ws&&this.ws.readyState===1){ this.ws.send(JSON.stringify(o)); return; }
    const now=Date.now();
    if(!this._sendWarnAt||now-this._sendWarnAt>3000){ this._sendWarnAt=now; toast("连接未就绪，正在重连…"); }
  },
  connect(onOpen){
    const self=this; this._connFailed=false;
    try{ this.ws=new WebSocket(PW_WS_URL); }
    catch(e){ if(!this._connFailed){this._connFailed=true; toast("无法连接服务器："+PW_WS_URL);} return; }
    this.ws.onopen=()=>{
      const s=restoreSession();
      if(s && !self.roomId){ self.roomId=s.roomId; self.pid=s.pid; self.nickname=s.nickname||""; }
      if(self.roomId && self.pid){ self.send({t:"rejoin",room_id:self.roomId,pid:self.pid}); }
      else if(onOpen) onOpen();
    };
    this.ws.onmessage=(ev)=>{ let m; try{ m=JSON.parse(ev.data); }catch(_){ return; } self.handle(m); };
    this.ws.onerror=()=>{ if(!self._connFailed){ self._connFailed=true; toast("无法连接服务器："+PW_WS_URL); } };
    this.ws.onclose=()=>{
      if(self.roomId && self.status!=="game_over"){
        toast("连接断开，5 秒后自动重连…");
        setTimeout(()=>{ if(self.roomId && self.status!=="game_over") self.connect(); },5000);
      }else if(!self._connFailed){ self._connFailed=true; toast("无法连接服务器，请先启动服务端（node server.js）或部署线上"); }
    };
  },
  handle(m){
    switch(m.t){
      case "created":
        this.roomId=m.room_id; this.pid=m.pid; this.nickname=m.nickname;
        this.players=m.players; this.wall=m.wall||[]; this.status="lobby";
        this.hostPid=m.hostPid||m.pid;
        this.createSeconds=m.rules.createSeconds; this.lockSeconds=m.rules.lockSeconds;
        this.poolMode=m.poolMode||"mixed"; this.customImgs=m.customImgs||[];
        this.reconnectAt=Date.now(); this.reveal=null; this.over=null; this.canvas=[]; this.canvasBg="#FFFFFF";
        saveSession();
        /* 房间图库为空且个人图库有图 → 引导导入（携带已取消，统一房间内导入） */
        if(!(this.customImgs||[]).length && this.status==="lobby"){
          customList().then(l=>{ if(l.length) toast(`你的图库有 ${l.length} 张图，点「从我的图库导入」即可带进房间`); });
        }
        renderOnlineLobby(); break;
      case "joined":
        this.roomId=m.room_id; this.pid=m.pid;
        this.players=m.players; this.hostPid=m.hostPid||""; this.wall=m.wall||[]; this.canvas=(m.canvas&&m.canvas.els)||[]; this.canvasBg=(m.canvas&&m.canvas.bg)||"#FFFFFF";
        this.round=m.round; this.maxRounds=m.maxRounds; this.deadline=m.deadline;
        this.createSeconds=m.createSeconds; this.lockSeconds=m.lockSeconds;
        this.target=m.target; this.status=m.status; this.reconnectAt=Date.now();
        this.poolMode=m.poolMode||this.poolMode; this.customImgs=m.customImgs||this.customImgs;
        this.drawer=(m.drawerIdx>=0&&m.players[m.drawerIdx])?{pid:m.players[m.drawerIdx].pid,nickname:m.players[m.drawerIdx].nickname}:{pid:"",nickname:""};
        saveSession();
        if(m.resumed) toast("已恢复身份，回到房间");
        if(this.status==="lobby") renderOnlineLobby();
        else if(this.status==="playing"){ preloadThumbs(this.wall); renderOnlineRoom(); }
        else renderOnlineReveal();
        break;
      case "player_joined":
        this.players=m.players; this.hostPid=m.hostPid||this.hostPid;
        if(this.status==="lobby") renderOnlineLobby();
        break;
      case "round_start":
        this.round=m.round; this.deadline=m.deadline; this.createSeconds=m.createSeconds;
        this.lockSeconds=m.lockSeconds; this.drawer=m.drawer; this.status="playing";
        this.wall=m.wall||[]; this.target=m.target; this.reveal=null; this.over=null; this.answered=0; this.canvas=[]; this.canvasBg="#FFFFFF";
        this.exactHits=m.exactHits||[];
        if(window.__pwFeedProgress) window.__pwFeedProgress();
        preloadThumbs(this.wall);
        renderOnlineRoom(); break;
      case "canvas":
        this.canvas=m.els||[];
        if(m.bg) this.canvasBg=m.bg;
        if(window.__pwGuessUpdate) window.__pwGuessUpdate();
        break;
      case "guess_status":
        this.answered=m.answered; this.total=m.total;
        if(window.__pwDrawerStatus) window.__pwDrawerStatus(m);
        break;
      case "guess_ok":
        if(window.__pwGuessOk) window.__pwGuessOk(m);
        else if(m.correct) toast(m.first?"🎉 首答正确！+3 分（等待揭晓）":"✅ 猜中！+1 分（等待揭晓）");
        else if(m.done) toast("没猜中，机会用完，等待揭晓…");
        else toast(`没猜中，还有 ${m.maxAttempts-m.attempts} 次机会`);
        break;
      case "word_res":
        if(window.__pwWordRes) window.__pwWordRes(m);
        else if(m.correct) toast(m.repeat?`已文字命中（${levelLabel(m.level)}）`:`🎯 文字命中！${levelLabel(m.level)}`);
        break;
      case "word_hit":
        if(window.__pwWordHit) window.__pwWordHit(m);
        else if(!window.__pwDrawerWord) toast(`${m.nickname} 猜中了${levelLabel(m.level)}`);
        break;
      case "word_view":
        if(window.__pwDrawerWord) window.__pwDrawerWord(m);
        break;
      case "guess_view":
        if(window.__pwDrawerGuess) window.__pwDrawerGuess(m);
        break;
      case "list":
        if(window.__pwRooms) window.__pwRooms(m);
        break;
      case "reveal":
        this.reveal=m; this.status=m.state;
        gameCollect(m.wall||[]);   // 对局收藏：自动保存本局房间自定义图到本地
        renderOnlineReveal(); break;
      case "game_over":
        this.over=m; this.status="game_over"; renderOnlineReveal(); break;
      case "left":
        if(m.destroyed) toast(m.msg||"你是最后一位玩家，房间已关闭");
        pwReset(); location.hash="#/"; break;
      case "room_closed":
        toast(m.msg||"房间已关闭");
        pwReset(); location.hash="#/"; break;
      case "mode_set":
        this.poolMode=m.mode;
        if(this.status==="lobby") renderOnlineLobby(); break;
      case "pool_preview":
        if(window.__pwPoolPreview) window.__pwPoolPreview(m);
        break;
      case "pool_locked":
        if(window.__pwPoolClose) window.__pwPoolClose();
        toast(`图池已锁定（${m.count||16} 张）`);
        break;
      case "img_added":
        this.customImgs=m.list||[];
        if(this.status==="lobby") renderOnlineLobby();
        if(window.__pwUpload && window.__pwUpload.pending){
          window.__pwUpload.pending=false;
          toast("已上传："+((m.img&&m.img.zh)||"图片"));
          if(window.__pwUpload.remove) window.__pwUpload.remove();
        } else if(m.img && m.img.contributor && m.img.contributor!==this.nickname){
          toast("有新图片加入房间");
        }
        break;
      case "img_removed":
        this.customImgs=m.list||[];
        if(this.status==="lobby") renderOnlineLobby(); break;
      case "kicked":
        toast(m.msg||"你的账号已在另一处进入该房间");
        clearSession();
        Object.assign(this,{roomId:"",pid:"",hostPid:"",status:"lobby",players:[],reveal:null,over:null,canvas:[],reconnectAt:0});
        if(location.hash.indexOf("onlinetest")<0 && location.hash.indexOf("puzzletest")<0) location.hash="#/online";
        break;
      case "room_reset":
        this.players=m.players; this.hostPid=m.hostPid||""; this.status="lobby"; this.reveal=null; this.over=null; this.canvas=[]; this.canvasBg="#FFFFFF";
        saveSession();
        renderOnlineLobby(); break;
      case "error":
        if(window.__pwUpload && window.__pwUpload.pending){
          window.__pwUpload.pending=false;
          window.__pwUpload.ok.disabled=false; window.__pwUpload.ok.textContent="上传";
          toast(m.msg||"上传失败");
          return;
        }
        if(m.err==="cooldown" && window.__pwCooldownMsg) window.__pwCooldownMsg(m.remain);
        else if(m.err==="tried") toast(m.msg||"这张照片试过了");
        else if(m.err==="not_found"){
          clearSession();
          Object.assign(this,{roomId:"",pid:"",hostPid:"",status:"lobby",players:[],reveal:null,over:null,canvas:[],reconnectAt:0});
          toast(m.msg||"房间已关闭或身份失效，请重新加入");
          if(location.hash.indexOf("onlinetest")<0 && location.hash.indexOf("puzzletest")<0) location.hash="#/online";
        }
        else toast(m.msg||"操作失败"); break;
    }
  }
};
window.__pwDrawerStatus = (m)=>{ toast(`有人已作答（${m.answered}/${m.total}）`); };

/* 主动退出：确认后发 leave（最后一位玩家离开时房间立即关闭） */
function pwLeave(){
  if(!window.confirm("确定离开房间吗？")) return;
  if(__PW.ws&&__PW.ws.readyState===1){ __PW.send({t:"leave"}); }
  else{ pwReset(); location.hash="#/"; }
}
/* 房主解散房间 */
function pwDisband(){
  if(!window.confirm("解散房间？房间将立即关闭，所有玩家会被移出。")) return;
  if(__PW.ws&&__PW.ws.readyState===1){ __PW.send({t:"disband"}); }
}
function saveSession(){
  try{ localStorage.setItem("pw_session", JSON.stringify({roomId:__PW.roomId,pid:__PW.pid,nickname:__PW.nickname})); }catch(_){}
}
function clearSession(){
  try{ localStorage.removeItem("pw_session"); }catch(_){}
}
function restoreSession(){
  try{ const s=JSON.parse(localStorage.getItem("pw_session")||"null"); if(s&&s.roomId&&s.pid) return s; }catch(_){}
  return null;
}
function pwReset(){
  if(window.listTimer){ clearInterval(window.listTimer); window.listTimer=null; }
  try{ __PW.ws&&__PW.ws.close(); }catch(_){}
  clearSession();
  Object.assign(__PW,{roomId:"",pid:"",hostPid:"",status:"lobby",players:[],reveal:null,over:null,canvas:[],reconnectAt:0});
}
/* 持久设备身份：同一浏览器/玩家退出后再进，服务端据此复用原席位（昵称变化也不丢身份） */
function getDeviceId(){
  let d="";
  try{ d=localStorage.getItem("pw_device")||""; }catch(_){}
  if(!d){ d="d-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10); try{ localStorage.setItem("pw_device",d); }catch(_){} }
  return d;
}
function nickMemo(){ try{ return localStorage.getItem("pw_nick")||""; }catch(_){ return ""; } }
function saveNickMemo(n){ try{ if(n) localStorage.setItem("pw_nick",n); }catch(_){} }

    window.__pwRooms=(m)=>{ const box=document.querySelector("#pw-rooms"); if(box && m.rooms){ if(!m.rooms.length){ box.innerHTML='<div class="note">暂无等待中的房间，创建一个吧</div>'; } else { box.innerHTML=""; m.rooms.forEach(rm=>{ const row=html("div",{class:"review-item"}); row.innerHTML=`<div><b>${rm.host||"匿名"}</b><div class="sub">房间码 ${rm.room_id} · ${rm.players}/${rm.max} 人</div></div><button class="primary" id="pw-join-${rm.room_id}">加入</button>`; box.appendChild(row); row.querySelector(`#pw-join-${rm.room_id}`).onclick=()=>{ __PW.nickname=nick()||("玩家"+Math.floor(Math.random()*900+100)); pwConnect(()=>__PW.send({t:"join",room_id:rm.room_id,nickname:__PW.nickname,device:getDeviceId()})); }; }); } } };
    pwConnect(()=>{ if(window.__pwRooms) window.__pwRooms({rooms:[]}); loadRooms(); });
  }
  window.listTimer=setInterval(loadRooms,3000);
}
function pwConnect(action){
  if(__PW.ws&&__PW.ws.readyState===1){ action(); return; }
  __PW.connect(action);
}

  const uploadToRoom=()=>{

      <h3>上传图片到房间自定义图库</h3>
      <div class="sub">自动压缩后上传，实时同步给全房间，并存入你的个人图库。开局后锁定。</div>
      <label class="file-drop"><input type="file" id="sh-file" accept="image/*" style="display:none">
        <div style="font-size:30px;line-height:1">🖼️</div>
        <div style="margin-top:6px;color:var(--ink)">点击选择图片</div>
        <div class="sub" style="margin-top:2px">自动压缩到 512px</div>
      </label>
      <div id="sh-preview" style="display:none;margin-top:10px;text-align:center">
        <img id="sh-pvimg" style="max-width:128px;max-height:128px;width:auto;height:auto;object-fit:contain;border-radius:12px;border:2px solid #C7BCA4">
        <div class="sub" id="sh-fname" style="margin-top:4px"></div>
      </div>
      <div style="margin-top:12px">
        <div class="field-label">图片名称（猜题人可见）</div><input id="sh-zh" class="pw-in" placeholder="可留空，默认用准确词">
        <div class="field-label">准确词 <b style="color:#C0392B">* 必填</b></div><input id="sh-exact" class="pw-in" placeholder="如：帆船">
        <div class="field-label">类别词</div><input id="sh-cat" class="pw-in" placeholder="如：交通工具">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><div class="field-label">联想词 1</div><input id="sh-kw1" class="pw-in" placeholder="如：海"></div>
          <div><div class="field-label">联想词 2</div><input id="sh-kw2" class="pw-in" placeholder="可选"></div>
        </div>
      </div>
      <div class="row" style="margin-top:14px"><button class="primary" id="sh-ok" style="flex:1">上传</button><button class="ghost" id="sh-cancel">取消</button></div>
    </div>`;
    document.body.appendChild(mk);
    const fileEl=mk.querySelector("#sh-file"), preview=mk.querySelector("#sh-preview");
    fileEl.onchange=async()=>{
      const f=fileEl.files&&fileEl.files[0];
      if(!f){ preview.style.display="none"; window.__pwCropResult=null; return; }
      mk.querySelector("#sh-fname").textContent=f.name;
      const rawD=await fileToDataURL(f);
      const cropped=await cropImageDialog(rawD);
      if(!cropped){ fileEl.value=""; preview.style.display="none"; window.__pwCropResult=null; return; }
      window.__pwCropResult=cropped;
      mk.querySelector("#sh-pvimg").src=cropped;
      mk.querySelector("#sh-pvimg").style.objectFit="contain";
      mk.querySelector("#sh-pvimg").style.width="auto"; mk.querySelector("#sh-pvimg").style.height="auto";
      mk.querySelector("#sh-pvimg").style.maxWidth="128px"; mk.querySelector("#sh-pvimg").style.maxHeight="128px";
      preview.style.display="block";
    };
    mk.querySelector("#sh-cancel").onclick=()=>{ window.__pwUpload=null; mk.remove(); };
    mk.querySelector("#sh-ok").onclick=async()=>{
      const zh=mk.querySelector("#sh-zh").value.trim(), exact=mk.querySelector("#sh-exact").value.trim();
      const cat=mk.querySelector("#sh-cat").value.trim(), kw1=mk.querySelector("#sh-kw1").value.trim(), kw2=mk.querySelector("#sh-kw2").value.trim();
      if(!fileEl.files||!fileEl.files[0]){ toast("请先选择一张图片"); return; }
      if(!exact){ toast("准确词必填"); return; }
      let img;
      try{ img=await compressImage(window.__pwCropResult||await fileToDataURL(fileEl.files[0]),512,0.82); }
      catch(e){ toast("图片读取失败，请换一张"); return; }
      if(!img){ toast("图片压缩失败或过大，请换一张试试"); return; }
      if(img.length>1.5e6){ toast("图片太大（需 ≤1.5MB），请换一张"); return; }
      const ok=mk.querySelector("#sh-ok");
      ok.disabled=true; ok.textContent="上传中…";
      window.__pwUpload={pending:true, ok, remove:()=>{ window.__pwUpload=null; mk.remove(); }, img, zh:zh||exact, exact, keywords:[kw1,kw2].filter(Boolean), aliases:[], category_word:cat};
      window.__pwCropResult=null;
      __PW.send({t:"add_img",zh:zh||exact,img,exact,fp:await imgFp(img),keywords:[kw1,kw2].filter(Boolean),aliases:[],category_word:cat});
      /* 上传到房间的图自动存进个人图库（指纹去重：已有同图则更新词条） */
      try{

        const mine=await customList();
        const dup=mine.find(x=>x.fp===fp);
        if(dup){
          await customPut({...dup, name:zh||exact||dup.name, category_word:cat||dup.category_word, keywords:[kw1,kw2].filter(Boolean).length?[kw1,kw2].filter(Boolean):dup.keywords, exact:exact||dup.exact});

        }
      }catch(_){ /* 个人图库保存失败不阻塞房间上传 */ }
      setTimeout(()=>{
        const up=window.__pwUpload;
        if(up && up.pending){ up.pending=false; up.ok.disabled=false; up.ok.textContent="上传"; toast("上传超时，请检查连接后重试"); }

  card.querySelector("#pw-upload").onclick=()=>uploadToRoom();
  /* 从我的图库导入：双 tab（我的图库/对局收藏），按指纹标记已上传，可勾选或全部导入 */
  card.querySelector("#pw-import-custom").onclick=async()=>{
    const mine=await customList();

    if(!mine.length && !games.length){ toast("图库还没有图片，先上传一张或玩一局自动收藏"); return; }
    /* 房间图库指纹集（服务端 customMeta 返回 fp，不含图内容） */
    const roomFps=new Set((__PW.customImgs||[]).map(x=>x.fp||"").filter(Boolean));
    const fpOf=async(g)=>{ if(g.fp) return g.fp; try{ return await imgFp(g.img); }catch(e){ return ""; } };
    const mk=html("div",{class:"mask"});
    mk.innerHTML=`<div class="pop" style="max-width:520px">
      <h3>导入图片到房间</h3>
      <div class="sub">已带进房间的图片标记「已上传」，不会重复导入（房间图库上限 32 张）</div>

      <div id="imp-grid" class="img-grid" style="max-height:340px;overflow:auto"></div>
      <div class="row" style="margin-top:12px"><button class="primary" id="imp-ok" style="flex:1">导入所选（0 张）</button><button class="ghost" id="imp-all" style="flex:1">全部导入</button><button class="ghost" id="imp-cancel">取消</button></div>
    </div>`;
    document.body.appendChild(mk);
    const grid=mk.querySelector("#imp-grid"), okBtn=mk.querySelector("#imp-ok");
    let tab="mine", src=mine, picked=new Set(), upSet=new Set();
    const draw=()=>{
      grid.innerHTML="";
      src.forEach(g=>{
        const up=upSet.has(g.id);
        const b=html("div",{class:"img-cell"+(picked.has(g.id)?" on":"")+(up?" is-up":"")});
        b.innerHTML=`<img src="${esc(g.img)}" alt="${esc(g.name||g.exact||g.zh)}"><span>${esc(g.name||g.exact||g.zh)}</span>${up?`<div class="img-done">已上传</div>`:`<input type="checkbox" style="position:absolute;left:4px;top:4px;pointer-events:none" ${picked.has(g.id)?"checked":""}>`}`;
        const im=b.querySelector("img");
        if(im) im.onerror=()=>{ if(!b.querySelector(".img-broken")) b.appendChild(html("div",{class:"img-broken"},"加载失败")); };
        if(!up) b.onclick=()=>{
          if(picked.has(g.id)) picked.delete(g.id); else picked.add(g.id);
          draw(); okBtn.textContent=`导入所选（${picked.size} 张）`;
        };
        grid.appendChild(b);
      });
    };
    /* 计算当前 tab 的已上传集合（按指纹，兼容旧记录现场算） */
    const refreshUp=async()=>{
      const fps=new Set();
      for(const g of src){ const fp=await fpOf(g); if(fp && roomFps.has(fp)) fps.add(g.id); }
      upSet=fps; picked=new Set([...picked].filter(id=>!upSet.has(id))); draw(); okBtn.textContent=`导入所选（${picked.size} 张）`;
    };
    mk.querySelectorAll("#imp-tabs .pt-tab").forEach(t=>{
      t.onclick=()=>{
        mk.querySelectorAll("#imp-tabs .pt-tab").forEach(x=>x.classList.remove("on"));
        t.classList.add("on");
        tab=t.dataset.v; src=tab==="mine"?mine:games; picked=new Set(); refreshUp();
      };
    });
    const doImport=async(ids)=>{
      if(__PW.status!=="lobby"){ toast("游戏已开始，不能再导入"); mk.remove(); return; }
      let ok=0, fail=0, skip=0, dup=0;
      for(const g of src){
        if(!ids.includes(g.id)) continue;
        const fp=await fpOf(g);
        if(fp && roomFps.has(fp)){ dup++; continue; }
        let img;
        try{ img=await compressImage(g.img,512,0.82); }catch(e){ img=null; }
        if(!img || img.length>1.5e6){ fail++; continue; }
        if(!g.exact){ skip++; continue; }
        __PW.send({t:"add_img",zh:g.name||g.exact||g.zh,img,exact:g.exact,fp:await imgFp(img),keywords:g.keywords||[],aliases:g.aliases||[],category_word:g.category_word||""});
        ok++;
      }
      toast(`已提交导入 ${ok} 张`+(dup?`（${dup} 张已在房间跳过）`:"")+(fail?`（${fail} 张图片过大已跳过）`:"")+(skip?`（${skip} 张缺准确词已跳过）`:""));
      mk.remove();
    };
    refreshUp();
    mk.querySelector("#imp-cancel").onclick=()=>mk.remove();
    okBtn.onclick=()=>doImport([...picked]);
    mk.querySelector("#imp-all").onclick=()=>doImport(src.filter(g=>!upSet.has(g.id)).map(g=>g.id));
  };
  const st=card.querySelector("#pw-start");
  if(st) st.onclick=()=>{ if(__PW.players.length<2){ toast("至少 2 人才能开始"); return; } __PW.send({t:"start"}); };
}

  window.__pwGuessOk=(m)=>{

    }else{

  function buildWall(){

        </div>`;

          };
        };
      };
      wallEl.appendChild(c);
    });
    triedSet.forEach(i=>{
      const ch=wallEl.children[i];
      if(ch){ ch.disabled=true; ch.classList.add("tried"); ch.innerHTML=`<span class="coord">${coordLabel(i)}</span><span class="cross">✗</span>`; }
    });

  }

  function tick(){
    const left=Math.max(0,Math.ceil((__PW.deadline-Date.now())/1000));
    const mm=Math.floor(left/60),ss=left%60;
    const el=card.querySelector("#pw-gtimer");

  const pwGtick=setInterval(tick,500); tick();
}

function renderOnlineReveal(){
  sfx("reveal");

  $app.innerHTML="";

    const nameOf=(pid)=>{ const p=__PW.players.find(x=>x.pid===pid); return p?p.nickname:""; };

    if(rev.answerImg) inner+=`<div class="answer-img"><img src="${rev.answerImg}" alt="答案照片"></div>`;
  }
  inner+=`<h3>本轮结算</h3><div id="pw-results"></div><h3>总分榜</h3><div id="pw-scores"></div>`;

    const label=r.role==="drawer"?`出题人 · 被猜中 ${r.hitCount||0} 次`:(r.guessed==null?`${wTag}未作答`:r.correct?`${wTag}猜 ${coordLabel(r.guessed)} ✓${r.first?" · 首答":""}${r.attempts>1?" · 第"+r.attempts+"次":""}`:`${wTag}猜 ${coordLabel(r.guessed)} ✗${r.attempts>1?" · 第"+r.attempts+"次":""}`);
    row.innerHTML=`<div><b>${r.nickname}</b><div class="sub">${label}</div></div><span class="res" style="${r.points>0?"color:var(--ok)":"color:var(--bad)"};font-weight:700">${r.points>0?"+"+r.points:r.points} 分</span>`;
    resEl.appendChild(row);
  });
  const scEl=card.querySelector("#pw-scores");
  Object.entries(data.scores||{}).sort((a,b)=>b[1]-a[1]).forEach(([pid,sc])=>{
    const p=__PW.players.find(x=>x.pid===pid);
    const row=html("div",{class:"review-item"});
    row.innerHTML=`<div><b>${p?p.nickname:pid}</b>${pid===__PW.pid?'<span class="tag" style="margin-left:6px">你</span>':''}</div><span class="res" style="font-weight:700">${sc} 分</span>`;

    ${results.map(r=>`<tr><td>${r.name}</td><td style="color:${r.ok?"var(--ok)":"var(--bad)"};font-weight:700">${r.ok?"PASS":"FAIL"}</td><td>${r.detail||""}</td></tr>`).join("")}
    </tbody></table>
    <div class="foot-actions"><button class="primary" onclick="location.hash='#/online'">去联机对战</button><button class="ghost" onclick="location.hash='#/'">回首页</button></div>`;
  w.appendChild(card);$app.appendChild(w);
}
function runRoute(){
  try{ route(); }
  catch(e){
    $app.innerHTML=`<div class="wrap"><div class="card"><h1>页面出错</h1><pre style="white-space:pre-wrap;word-break:break-all;font-size:13px;color:#C92A2A">${(e&&e.stack?e.stack:e+"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</pre></div></div>`;
  }
}
window.addEventListener("hashchange",runRoute);
runRoute();
</script>
</body>
</html>
